---
name: Release

"on":
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run lint

      - name: Verify manifest and versions.json match tag
        run: |
          tag="$GITHUB_REF_NAME"
          manifest_version=$(jq -r '.version' manifest.json)
          manifest_min=$(jq -r '.minAppVersion' manifest.json)
          versions_min=$(jq -r --arg t "$tag" '.[$t] // ""' versions.json)
          if [[ "$manifest_version" != "$tag" ]]; then
            echo "version mismatch: manifest=$manifest_version tag=$tag" >&2
            exit 1
          fi
          if [[ -z "$versions_min" ]]; then
            echo "versions.json missing entry for $tag" >&2
            exit 1
          fi
          if [[ "$versions_min" != "$manifest_min" ]]; then
            echo "minAppVersion mismatch:" >&2
            echo "  manifest=$manifest_min" >&2
            echo "  versions.json[$tag]=$versions_min" >&2
            exit 1
          fi

      - run: npm run build

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
